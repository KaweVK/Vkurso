services:
  backend:
    container_name: vkursos-api
    build:
      context: ./back/vkurso
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-vkursos}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      SPRING_DATA_REDIS_HOST: ${REDIS_HOST:-redis}
      SPRING_DATA_REDIS_PORT: ${REDIS_PORT:-6379}
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-vkursos}
      STORAGE_MINIO_ENDPOINT: http://minio:9000
      STORAGE_MINIO_PUBLIC_ENDPOINT: ${MINIO_PUBLIC_ENDPOINT:-http://localhost:9000}
      STORAGE_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      STORAGE_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      STORAGE_MINIO_BUCKET: ${MINIO_BUCKET:-vkurso-videos}
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD}
      MAIL_USERNAME: ${MAIL_USERNAME}
      RESEND_API_KEY: ${RESEND_API_KEY}
      URL_FRONTEND: ${URL_FRONTEND}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - vkursos-net

  frontend:
    container_name: vkursos-frontend
    build:
      context: ./front
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_started
    networks:
      - vkursos-net

  postgres:
    profiles: ["local"]
    image: postgres:16-alpine
    container_name: vkursos-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vkursos}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vkursos} -d ${POSTGRES_DB:-vkursos}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vkursos-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: vkursos-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@vkursos.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - vkursos-net

  redis:
    profiles: ["local"]
    image: redis:7-alpine
    container_name: vkursos-redis
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-vkursos}"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-vkursos}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vkursos-net

  minio:
    image: minio/minio:latest
    container_name: vkursos-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Console web
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vkursos-net

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:
  minio_data:

networks:
  vkursos-net:
    driver: bridge
