name: CI - Backend

on: 
  push:
  pull_request:
    branches: [main]
    paths:
      - 'back/vkurso**'
      - '.github/workflows/ci-backend.yaml'

permissions: 
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: vkurso_test
          POSTGRES_USER: vkursos
          POSTGRES_PASSWORD: vkursos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vkursos -d vkurso_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps: 
      - name: Baixar código
        uses: actions/checkout@v7

      - name: Configurar Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: back/vkurso/pom.xml

      - name: Permitir execução do Maven Wrapper
        working-directory: back/vkurso
        run: chmod +x mvnw

      - name: Compilar e executar testes
        working-directory: back/vkurso
        run: mvn -B clean verify
